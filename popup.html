<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Extension UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jQuery & Select2 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            width: 350px; /* Chrome pop-up standart genişliği */
            height: auto;
            margin: 0;
            background-color: #f8f9fa;
        }

        .tab-active {
            color: #1a73e8;
            border-bottom: 2px solid #1a73e8;
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none; }

        /* Custom Checkbox Styling */
        .custom-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #1a73e8;
        }

        /* Select2 Tailwind Integration */
        .select2-container .select2-selection--single {
            height: 38px !important;
            border-color: #d1d5db !important;
            border-radius: 0.375rem !important;
            display: flex !important;
            align-items: center !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
            right: 4px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #1f2937 !important;
            font-size: 0.875rem !important;
            padding-left: 0.75rem !important;
            line-height: normal !important;
        }
        .select2-search__field {
            font-size: 0.875rem !important;
            outline: none !important;
        }
        .select2-results__option {
            font-size: 0.875rem !important;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 bg-white border-b border-gray-200 shadow-sm">
        <div class="flex items-center gap-2">
            <!-- Google Colors Placeholder Logo -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.3h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.5c2.1-2 3.3-4.8 3.3-8.1z" fill="#4285F4"/>
                <path d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.7H2.2v2.8C4.1 20.6 7.8 23 12 23z" fill="#34A853"/>
                <path d="M5.7 14c-.2-.7-.4-1.4-.4-2s.2-1.3.4-2V7.2H2.2C1.4 8.7 1 10.3 1 12s.4 3.3 1.2 4.8l3.5-2.8z" fill="#FBBC05"/>
                <path d="M12 5.4c1.6 0 3.1.6 4.2 1.6l3.2-3.2C17.5 2 15 1 12 1 7.8 1 4.1 3.4 2.2 7.2l3.5 2.8c.9-2.7 3.4-4.6 6.3-4.6z" fill="#EA4335"/>
            </svg>
            <h1 class="font-semibold text-sm">CleanSheet Assistant Pro</h1>
        </div>
        <span class="text-[10px] text-gray-400 font-medium">v1.0.0</span>
    </div>

    <!-- Tabs Navigation -->
    <div class="flex bg-white border-b border-gray-200">
        <button id="tabQuickBtn" class="flex-1 py-3 text-sm font-medium transition-all text-gray-500 hover:text-gray-700">Hızlı Kullanım</button>
        <button id="tabSettingsBtn" class="flex-1 py-3 text-sm font-medium transition-all tab-active">Ayarlar</button>
    </div>

    <!-- Tab Content Container -->
    <div class="p-4 min-h-[320px]">
        
        <!-- SECTION: AYARLAR -->
        <div id="sectionSettings" class="">
            
            <!-- Aşama 1: Kullanıcı Girişi -->
            <div id="loginFormContainer">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">Giriş Yap</h2>
                
                <!-- Login Method Tabs -->
                <div class="flex mb-4 bg-gray-100 p-1 rounded-md">
                    <button id="loginTabEmail" class="flex-1 py-1.5 text-xs font-medium bg-white text-gray-800 rounded shadow-sm transition-all">E-Posta</button>
                    <button id="loginTabToken" class="flex-1 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-700 transition-all">Token</button>
                </div>

                <div class="space-y-4">
                    <div id="emailAuthFields" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">E-posta</label>
                            <input type="email" id="email" placeholder="ornek@mail.com" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Şifre</label>
                            <input type="password" id="password" placeholder="••••••••" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        </div>
                    </div>

                    <div id="tokenAuthFields" class="hidden">
                        <label class="block text-xs font-medium text-gray-600 mb-1">API Token</label>
                        <input type="text" id="token" placeholder="Token giriniz..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    
                    <div id="loginMessage" class="hidden p-2 rounded text-xs"></div>

                    <button id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition-all shadow-sm flex items-center justify-center gap-2">
                        <span>Giriş Yap</span>
                    </button>
                </div>
            </div>

            <!-- Aşama 2: Profil Seçimi (Girişten Sonra) -->
            <div id="profileSelectionContainer" class="hidden">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">Profil ve Tercihler</h2>
                <div class="space-y-4">
                    <div class="bg-blue-50 p-3 rounded-lg flex items-center gap-3 border border-blue-100">
                        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg">U</div>
                        <div>
                            <p class="text-sm font-semibold" id="userName">Kullanıcı Adı</p>
                            <p class="text-[11px] text-gray-500" id="userEmail">email@example.com</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Profil:</label>
                        <select id="profileSelect" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none bg-white">
                            <option value="1">SEO Analiz Profili</option>
                            <option value="2">Backlink Takip</option>
                            <option value="3">İçerik Editörü</option>
                        </select>
                    </div>

                    <!-- Aktivite Takibi Seçeneği -->
                    <label class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors group">
                        <div class="flex flex-col">
                            <span class="text-sm font-medium text-gray-700 group-hover:text-blue-600 transition-colors">Aktivite Takibi</span>
                            <span class="text-[10px] text-gray-500 mt-0.5 leading-tight pr-2">Fare ve klavye hareketlerini göndermeme izin ver</span>
                        </div>
                        <div class="relative flex-shrink-0">
                            <input type="checkbox" id="allowMouseTracking" class="sr-only peer">
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </div>
                    </label>

                    <div class="flex gap-2 pt-2">
                        <button id="btnSaveProfile" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-md transition-all shadow-sm">
                            Uygula
                        </button>
                        <button id="btnLogout" class="px-4 border border-gray-300 hover:bg-gray-50 text-gray-600 text-sm font-medium py-2 rounded-md transition-all">
                            Çıkış
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- SECTION: HIZLI KULLANIM -->
        <div id="sectionQuickUse" class="hidden">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">Hızlı Erişim</h2>
            <div class="grid grid-cols-1 gap-3">
                
                <button class="quick-action-btn group flex items-center gap-3 p-3 bg-white border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all text-left">
                    <div class="p-2 bg-gray-100 group-hover:bg-blue-100 rounded-md transition-colors">
                        <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium">Google'da Ara</div>
                        <div class="text-[10px] text-gray-400">Şu an açık olan linki Google'da arar</div>
                    </div>
                </button>

                <button class="quick-action-btn group flex items-center gap-3 p-3 bg-white border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all text-left">
                    <div class="p-2 bg-gray-100 group-hover:bg-blue-100 rounded-md transition-colors">
                        <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium">Google Index Kontrolü</div>
                        <div class="text-[10px] text-gray-400">URL index durumunu sorgular</div>
                    </div>
                </button>

                <button class="quick-action-btn group flex items-center gap-3 p-3 bg-white border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all text-left">
                    <div class="p-2 bg-gray-100 group-hover:bg-blue-100 rounded-md transition-colors">
                        <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium">Backoffice'de Aç</div>
                        <div class="text-[10px] text-gray-400">Şu an açık olan linki panelde yeni sekmede açar</div>
                    </div>
                </button>

            </div>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="fixed bottom-4 left-4 right-4 bg-gray-900 text-white text-xs py-2 px-3 rounded shadow-lg transform translate-y-20 transition-transform duration-300 flex items-center justify-between">
        <span id="toastMsg">İşlem başarılı</span>
        <button onclick="hideToast()" class="text-gray-400 hover:text-white">✕</button>
    </div>

    <script>
        // Init Select2
        $(document).ready(function() {
            $('#profileSelect').select2({
                width: '100%',
                language: {
                    noResults: function() {
                        return "Sonuç bulunamadı";
                    }
                }
            });
        });

        // DOM Elements
        const tabSettingsBtn = document.getElementById('tabSettingsBtn');
        const tabQuickBtn = document.getElementById('tabQuickBtn');
        const sectionSettings = document.getElementById('sectionSettings');
        const sectionQuickUse = document.getElementById('sectionQuickUse');
        
        const loginFormContainer = document.getElementById('loginFormContainer');
        const profileSelectionContainer = document.getElementById('profileSelectionContainer');
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const loginMessage = document.getElementById('loginMessage');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // Login Tabs Elements
        const loginTabEmail = document.getElementById('loginTabEmail');
        const loginTabToken = document.getElementById('loginTabToken');
        const emailAuthFields = document.getElementById('emailAuthFields');
        const tokenAuthFields = document.getElementById('tokenAuthFields');
        
        let loginMethod = 'email'; // 'email' or 'token'

        // Login Tabs Switching Logic
        loginTabEmail.addEventListener('click', () => {
            loginMethod = 'email';
            loginTabEmail.classList.add('bg-white', 'text-gray-800', 'shadow-sm');
            loginTabEmail.classList.remove('text-gray-500', 'hover:text-gray-700');
            loginTabToken.classList.add('text-gray-500', 'hover:text-gray-700');
            loginTabToken.classList.remove('bg-white', 'text-gray-800', 'shadow-sm');
            
            emailAuthFields.classList.remove('hidden');
            tokenAuthFields.classList.add('hidden');
        });

        loginTabToken.addEventListener('click', () => {
            loginMethod = 'token';
            loginTabToken.classList.add('bg-white', 'text-gray-800', 'shadow-sm');
            loginTabToken.classList.remove('text-gray-500', 'hover:text-gray-700');
            loginTabEmail.classList.add('text-gray-500', 'hover:text-gray-700');
            loginTabEmail.classList.remove('bg-white', 'text-gray-800', 'shadow-sm');
            
            tokenAuthFields.classList.remove('hidden');
            emailAuthFields.classList.add('hidden');
        });

        // Tab Switching Logic
        tabSettingsBtn.addEventListener('click', () => {
            tabSettingsBtn.classList.add('tab-active');
            tabSettingsBtn.classList.remove('text-gray-500');
            tabQuickBtn.classList.remove('tab-active');
            tabQuickBtn.classList.add('text-gray-500');
            
            sectionSettings.classList.remove('hidden');
            sectionQuickUse.classList.add('hidden');
        });

        tabQuickBtn.addEventListener('click', () => {
            tabQuickBtn.classList.add('tab-active');
            tabQuickBtn.classList.remove('text-gray-500');
            tabSettingsBtn.classList.remove('tab-active');
            tabSettingsBtn.classList.add('text-gray-500');
            
            sectionQuickUse.classList.remove('hidden');
            sectionSettings.classList.add('hidden');
        });

        // Simulating Login
        btnLogin.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const token = document.getElementById('token').value;

            if (loginMethod === 'email' && (!email || !pass)) {
                showLoginError("Lütfen tüm alanları doldurun.");
                return;
            } else if (loginMethod === 'token' && !token) {
                showLoginError("Lütfen token girin.");
                return;
            }

            // Button Loading State
            const originalContent = btnLogin.innerHTML;
            btnLogin.innerHTML = '<span class="loader"></span> <span>Giriş Yapılıyor...</span>';
            btnLogin.disabled = true;

            // Simulate Network Delay
            setTimeout(() => {
                // TODO: API logic here
                let success = false;
                let userEmail = "";
                
                if (loginMethod === 'email') {
                    if (email === "demo@example.com" && pass === "123456") {
                        success = true;
                        userEmail = email;
                    }
                } else if (loginMethod === 'token') {
                    if (token === "demo-token") {
                        success = true;
                        userEmail = "token_user@example.com";
                    }
                }

                if (success) {
                    // Success Case
                    loginFormContainer.classList.add('hidden');
                    profileSelectionContainer.classList.remove('hidden');
                    document.getElementById('userName').textContent = "Demo Kullanıcı";
                    document.getElementById('userEmail').textContent = userEmail;
                    showToast("Başarıyla giriş yapıldı!");
                } else {
                    if (loginMethod === 'email' && email === "demo@example.com") {
                         showLoginError("Hata: Şifre yanlış.");
                    } else if (loginMethod === 'token') {
                         showLoginError("Hata: Geçersiz token.");
                    } else {
                         showLoginError("Hata: Kullanıcı bulunamadı.");
                    }
                    btnLogin.innerHTML = originalContent;
                    btnLogin.disabled = false;
                }
            }, 1500);
        });

        // Logout
        btnLogout.addEventListener('click', () => {
            profileSelectionContainer.classList.add('hidden');
            loginFormContainer.classList.remove('hidden');
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";
            document.getElementById('token').value = "";
            document.getElementById('allowMouseTracking').checked = false;
            loginMessage.classList.add('hidden');
            showToast("Çıkış yapıldı.");
        });

        // Profile Selection Feedback
        document.getElementById('btnSaveProfile').addEventListener('click', () => {
            const profile = document.getElementById('profileSelect').options[document.getElementById('profileSelect').selectedIndex].text;
            const trackingAllowed = document.getElementById('allowMouseTracking').checked;
            
            let message = `${profile} aktif edildi.`;
            if(trackingAllowed) message += " Fare/Klavye takibi açık.";
            
            showToast(message);
        });

        // Quick Actions Feedback
        document.querySelectorAll('.quick-action-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.querySelector('.text-sm').textContent;
                showToast(`${action} başlatılıyor...`);
            });
        });

        // Helper Functions
        function showLoginError(msg) {
            loginMessage.textContent = msg;
            loginMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
            loginMessage.classList.add('bg-red-100', 'text-red-700');
        }

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20');
            setTimeout(hideToast, 3000);
        }

        function hideToast() {
            toast.classList.add('translate-y-20');
        }
    </script>
</body>
</html>
